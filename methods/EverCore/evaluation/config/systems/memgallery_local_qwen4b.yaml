name: memgallery_local_qwen4b
adapter: rag
sample_workers: 2
chunking:
  strategy: token
  chunk_size: 256
  chunk_overlap: 32
  tokenizer_model: gpt-4
  expand_turns_on_display: true
  dedup_turns_on_display: false
embedding:
  model: ${VECTORIZE_MODEL:text-embedding-v4}
  api_key: ${VECTORIZE_API_KEY}
  base_url: ${VECTORIZE_BASE_URL}
  batch_size: 10
rerank:
  enabled: true
  provider: local_qwen3
  model: Qwen/Qwen3-Reranker-4B
  model_path: ${QWEN_RERANK_MODEL_PATH}
  ready_marker: load_test_passed.json
  device: cuda:0
  batch_size: 4
  max_length: 8192
search:
  embedding_top_k: 128
  rerank_top_k: 15
llm:
  model: ${VLM_MODEL:gpt-4o-mini}
  api_key: ${VLM_API_KEY}
  base_url: ${VLM_BASE_URL}
vision:
  model: ${VLM_MODEL:gpt-4o-mini}
  api_key: ${VLM_API_KEY}
  base_url: ${VLM_BASE_URL}
  max_tokens: 512
  temperature: 0
