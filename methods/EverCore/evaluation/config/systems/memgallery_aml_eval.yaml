name: memgallery_aml_eval
adapter: rag
sample_workers: 2
chunking:
  strategy: token
  chunk_size: 256
  chunk_overlap: 32
  tokenizer_model: gpt-4
  expand_turns_on_display: true
  dedup_turns_on_display: false
embedding:
  model: ${VECTORIZE_MODEL:text-embedding-v4}
  api_key: ${VECTORIZE_API_KEY}
  base_url: ${VECTORIZE_BASE_URL}
  batch_size: 10
rerank:
  enabled: true
  model: ${RERANK_MODEL:rerank-v3.5}
  api_key: ${RERANK_API_KEY}
  base_url: ${RERANK_BASE_URL:https://api.cohere.com}
  endpoint: ${RERANK_ENDPOINT:/v2/rerank}
  proxy_url: ${RERANK_PROXY_URL:}
  min_interval_seconds: 6.2
search:
  embedding_top_k: 128
  rerank_top_k: 15
llm:
  model: ${VLM_MODEL:gpt-4o-mini}
  api_key: ${VLM_API_KEY}
  base_url: ${VLM_BASE_URL}
vision:
  model: ${VLM_MODEL:gpt-4o-mini}
  api_key: ${VLM_API_KEY}
  base_url: ${VLM_BASE_URL}
  max_tokens: 512
  temperature: 0
