server {
    listen 80 default_server;
    server_name __PUBLIC_IP__;
    server_tokens off;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/rawrag-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://__PUBLIC_IP__$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name __PUBLIC_IP__;
    server_tokens off;
    access_log off;
    ssl_certificate /etc/letsencrypt/live/rawrag-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rawrag-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 128m;
    client_body_timeout 1800s;
    send_timeout 1800s;

    location = /health {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    location = /v1/memories/add {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location = /v1/memories/search {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location / {
        return 404;
    }
}
